<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f4c5c"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- Sun rays -->
  <g opacity="0.6" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round">
    <line x1="100" y1="30" x2="100" y2="18"/>
    <line x1="130" y1="38" x2="138" y2="29"/>
    <line x1="150" y1="65" x2="160" y2="59"/>
    <line x1="70"  y1="38" x2="62"  y2="29"/>
    <line x1="50"  y1="65" x2="40"  y2="59"/>
  </g>

  <!-- Rising sun -->
  <path d="M 56 108 A 44 44 0 0 1 144 108 Z" fill="url(#sunGrad)"/>

  <!-- Horizon line -->
  <line x1="26" y1="108" x2="174" y2="108" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Rhythm waves -->
  <path d="M 32 132 C 48 119, 64 145, 80 132 C 96 119, 112 145, 128 132 C 144 119, 160 145, 172 132"
        stroke="#2dd4bf" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 32 152 C 48 139, 64 165, 80 152 C 96 139, 112 165, 128 152 C 144 139, 160 165, 172 152"
        stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
